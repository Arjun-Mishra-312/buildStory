name: Production release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run verify:product
      - run: npm run check:artifact
      - run: npm --prefix apps/buildstory-web run check:production-config
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          BUILDSTORY_STORE: d1
          BUILDSTORY_LOCAL_API_ENABLED: "false"
          BUILDSTORY_PUBLIC_ORIGIN: https://buildstory.dev
          BUILDSTORY_ALLOWED_HOSTS: buildstory.dev
      - run: npm --prefix apps/buildstory-web run build
      - run: npm --prefix apps/buildstory-web run prepare:deploy-config
      - run: npx tsx scripts/migrate-d1.ts --dry-run
        working-directory: apps/buildstory-web
      - run: npm --prefix apps/buildstory-web run deploy:preflight
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          BUILDSTORY_STORE: d1
          BUILDSTORY_LOCAL_API_ENABLED: "false"
          BUILDSTORY_PUBLIC_ORIGIN: https://buildstory.dev
          BUILDSTORY_ALLOWED_HOSTS: buildstory.dev

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/buildstory-web run build
      - run: npm --prefix apps/buildstory-web run prepare:deploy-config
      # The remote D1 was migrated by hand before scripts/migrate-d1.ts existed,
      # so it has no buildstory_migrations ledger. The baseline seeds that ledger
      # on the first run only, and it must name the LAST migration already
      # present or the run re-applies it and dies on "table already exists".
      # Verified against the live database 2026-08-07: exactly 16 buildstory_*
      # tables, matching 0000-0004; 0005's publication_path column and 0006's
      # buildstory_content_report_audit table are both absent. Ignored once the
      # ledger exists.
      - run: npx tsx scripts/migrate-d1.ts --baseline 0004_damp_ezekiel
        working-directory: apps/buildstory-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfa5ce4b5d65e18a3d1cdb834183f388
      - run: npm --prefix apps/buildstory-web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfa5ce4b5d65e18a3d1cdb834183f388
      - run: node --input-type=module -e "const r=await fetch('https://buildstory.dev/api/ready'); if(!r.ok) process.exit(1)"
      - name: Smoke public routes
        run: node --input-type=module -e "for (const path of ['/', '/about', '/explore', '/leaderboard', '/terms', '/privacy']) { const r = await fetch('https://buildstory.dev' + path); if (!r.ok) throw new Error(path + ' returned ' + r.status); }"
