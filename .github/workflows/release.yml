name: Production release

on:
  push:
    branches: [main]
  # Kept so a release can still be re-run by hand - e.g. to redeploy an
  # unchanged commit after rotating a Worker secret.
  workflow_dispatch:

permissions:
  contents: read

# Serialise releases. Two pushes landing close together would otherwise run two
# deploys and, worse, two `migrate-d1.ts` invocations against the same database.
# cancel-in-progress is deliberately false: cancelling a run midway through
# applying migrations is exactly the failure this is meant to prevent.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run verify:product
      - run: npm run check:artifact
      - run: npm --prefix apps/buildstory-web run check:production-config
        env:
          # Deliberately placeholders, not real secrets. check:production-config
          # calls productionRuntimeIssues(), which only asserts presence, length
          # and format - it never authenticates against Google or anything else.
          # The real credentials live in the Worker secret store and are never
          # needed to build or deploy. What actually validates them is the
          # post-deploy /api/ready probe below, which returns
          # {"configuration":false} if a real secret is missing or malformed.
          # So CI needs exactly one repository secret: CLOUDFLARE_API_TOKEN.
          AUTH_SECRET: ci-shape-check-only-not-a-real-secret-0000000000
          AUTH_GOOGLE_ID: ci-shape-check-only
          AUTH_GOOGLE_SECRET: ci-shape-check-only
          BUILDSTORY_STORE: d1
          BUILDSTORY_LOCAL_API_ENABLED: "false"
          BUILDSTORY_PUBLIC_ORIGIN: https://buildstory.dev
          BUILDSTORY_ALLOWED_HOSTS: buildstory.dev
          BUILDSTORY_CLOUD_PROVIDER: openrouter
          BUILDSTORY_LLM_BASE_URL: https://openrouter.ai/api/v1
          BUILDSTORY_LLM_MODEL: deepseek/deepseek-v4-flash
          BUILDSTORY_ENABLE_HOSTED_OPENAI: "false"
      - run: npm --prefix apps/buildstory-web run build
      - run: npm --prefix apps/buildstory-web run prepare:deploy-config
      - run: npx tsx scripts/migrate-d1.ts --dry-run
        working-directory: apps/buildstory-web
      - run: npm --prefix apps/buildstory-web run deploy:preflight
        env:
          # Deliberately placeholders, not real secrets. check:production-config
          # calls productionRuntimeIssues(), which only asserts presence, length
          # and format - it never authenticates against Google or anything else.
          # The real credentials live in the Worker secret store and are never
          # needed to build or deploy. What actually validates them is the
          # post-deploy /api/ready probe below, which returns
          # {"configuration":false} if a real secret is missing or malformed.
          # So CI needs exactly one repository secret: CLOUDFLARE_API_TOKEN.
          AUTH_SECRET: ci-shape-check-only-not-a-real-secret-0000000000
          AUTH_GOOGLE_ID: ci-shape-check-only
          AUTH_GOOGLE_SECRET: ci-shape-check-only
          BUILDSTORY_STORE: d1
          BUILDSTORY_LOCAL_API_ENABLED: "false"
          BUILDSTORY_PUBLIC_ORIGIN: https://buildstory.dev
          BUILDSTORY_ALLOWED_HOSTS: buildstory.dev
          BUILDSTORY_CLOUD_PROVIDER: openrouter
          BUILDSTORY_LLM_BASE_URL: https://openrouter.ai/api/v1
          BUILDSTORY_LLM_MODEL: deepseek/deepseek-v4-flash
          BUILDSTORY_ENABLE_HOSTED_OPENAI: "false"

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/buildstory-web run build
      - run: npm --prefix apps/buildstory-web run prepare:deploy-config
      # --baseline only does anything when buildstory_migrations is EMPTY, which
      # is no longer the case: the ledger was seeded on 2026-08-07 and now records
      # all 17 migrations, so this is a no-op against the current database and
      # every run simply applies whatever is new. It is kept because it is still
      # correct for a fresh environment (staging, or a rebuilt D1) that starts
      # from the same hand-migrated 0000-0004 schema. Do NOT lower this value:
      # naming an earlier tag on an empty ledger makes the run re-apply 0002+
      # onto existing tables and fail partway through.
      - run: npx tsx scripts/migrate-d1.ts --baseline 0004_damp_ezekiel
        working-directory: apps/buildstory-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfa5ce4b5d65e18a3d1cdb834183f388
      - run: npm --prefix apps/buildstory-web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfa5ce4b5d65e18a3d1cdb834183f388
      - run: node --input-type=module -e "const r=await fetch('https://buildstory.dev/api/ready'); if(!r.ok) process.exit(1)"
      - name: Smoke public routes
        run: node --input-type=module -e "for (const path of ['/', '/about', '/explore', '/leaderboard', '/terms', '/privacy']) { const r = await fetch('https://buildstory.dev' + path); if (!r.ok) throw new Error(path + ' returned ' + r.status); }"
